<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>Upload - SakuraVoid</title>
  <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
  />

        <!-- Bootstrap CSS v5.2.1 -->
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN"
            crossorigin="anonymous"
        />
        <script src="https://kit.fontawesome.com/5d505c9b72.js" crossorigin="anonymous"></script>
  <style>
      body {
        background-color: black;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      }

      .upload-container {
        background-color: #0d0b2d;
        padding: 2rem;
        border-radius: 10px;
        color: white;
        margin: 2rem auto;
        max-width: 900px;
      }

      .form-control {
        background-color: transparent;
        border: none;
        border-bottom: 1px solid white;
        color: white;
        border-radius: 0;
      }

      .form-control:focus {
        box-shadow: none;
        border-color: #7979f8;
      }

      .upload-icon {
        font-size: 5rem;
        color: #7979f8;
      }

      .btn-style {
        background: #007bff;
        color: white;
      }

      .btn-style:hover {
        background-color: #005ec3;
      }

      .btn-subir {
        background: #ff69b4;
        color: white;
      }

      .btn-subir:hover {
        background-color: #a04070;
      }

      .upload-icon {
        font-size: 6rem;
        color: #1f0382;
      }

      .upload-section {
        padding: 2rem;
      }

      .upload-form {
        background-color: black;
        padding: 2rem;
        border-radius: 10px;
        max-width: 600px;
        width: 100%;
        margin-top: 3rem;
      }

      .style-card {
        width: 250px;
        height: 400px;
        display: flex;
        flex-direction: column;
        background-color: #251479;
        color: white;
        border-radius: 10px;
        overflow: hidden;
      }

      .style-card .card-img-top {
        height: 70%;
        object-fit: cover;
        width: 100%;
      }

      .style-card .card-body {
        height: 30%;
        padding: 10px;
        overflow: hidden;
      }

      .style-card .card-title {
        font-size: 14px;
        margin-bottom: 4px;
      }

      .style-card .card-text {
        font-size: 12px;
        margin-bottom: 8px;
      }

      .style-card .btn-style {
        font-size: 12px;
      }

      input::placeholder,
      textarea::placeholder {
        color: gray !important;
        opacity: 1 !important;
      }
      .truncate-description {
          display: -webkit-box;
          -webkit-line-clamp: 3; /* muestra máximo 3 líneas */
          -webkit-box-orient: vertical;
          overflow: hidden;
          text-overflow: ellipsis;
          
      }

    .card-actions {
      margin-top: auto;
      display: flex;
      justify-content: space-between;
      gap: 4px;
      flex-wrap: wrap;

    }

    </style>
    <script src="../controllers/env.js"></script>
    <script src="../controllers/auth_controller.js"></script>
    <script src="../controllers/anime_controller.js"></script>
    <script src="../controllers/upload_controller.js"></script>
</head>
<body>

    <div id="loader-container" style="position: fixed; top:0; left:0; width:100vw; height:100vh; background:black; z-index:9999; display:flex; justify-content:center; align-items:center;">
    <canvas id="dotlottie-canvas" style="width: 300px; height:300px;"></canvas>
    </div>

  <header>
      <!-- NAVBAR -->
            <nav class="navbar navbar-expand-lg navbar-light fixed-top" style="background-color: #070522;">
              <div class="container-fluid">

                  <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                      <span class="navbar-toggler-icon"></span>
                  </button>
                  <div class="collapse navbar-collapse" id="navbarNav"  style="margin-top: 10px;">

                      <ul class="navbar-nav me-auto" style="width: 100%; display: flex; justify-content: flex-start; gap: 40px;">
                          <li class="nav-item" style="display: flex; flex-direction: column; align-items: center;">
                            <a href="home.html" title="Ir al inicio">
                              <img src="../assets/img/logo_transparente.png" alt="SakuraVoid" style=" width: 150px; height: 70px;">
                          </a>
                          </li>
                      
                          <li class="nav-item" style="display: flex; flex-direction: column; align-items: center;">
                            <a href="favoritos.html" title="favoritos">
                              <i class="fa-solid fa-heart-circle-plus" title="Favoritos" style="cursor: pointer; font-size: 20px; color: white;"></i>
                            </a>
                              <a class="nav-link" style="color: white; padding: 0;" href="favoritos.html">Favoritos</a>
                          </li>
                      
                          <li class="nav-item" style="display: flex; flex-direction: column; align-items: center;">
                            <a href="upload.html" title="Upload"></a>
                              <i class="fa-solid fa-cloud-arrow-up" title="Upload" style="cursor: pointer; font-size: 20px; color: #3084B8;"></i>
                              </a>
                              <a class="nav-link" style="color: #3084B8; padding: 0;" href="upload.html">Upload</a>
                          </li>
                      </ul>

                      <form class="d-flex me-3">
                        <input id="buscar" class="form-control me-2" type="search" placeholder="Buscar" aria-label="Search">
                        <button class="btn" type="submit">
                            <i class="fa-solid fa-magnifying-glass" id="iconobuscar" style="color: white;"></i>
                        </button>

                    </form>
                    <ul class="navbar-nav">
                        <li class="nav-item dropdown">
                            <a class="nav-link dropdown-toggle" href="#" id="userDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                            <i class="fas" style="font-size: 22px; color: white;">&#xf007;</i>
                            </a>
                            <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="userDropdown">
                            <li><a class="dropdown-item" href="perfil.html">Ver mi perfil</a></li>
                            <li><a class="dropdown-item text-danger" href="#" onclick="logout()">Cerrar sesión</a></li>
                            </ul>
                        </li>
                    </ul>
                  </div>
              </div>
        <!-- Modal de Cierre-->
        <div class="modal fade" id="logoutModal" tabindex="-1">
          <div class="modal-dialog">
              <div class="modal-content">
                  <div class="modal-header">
                      <h5 class="modal-title">Cerrar sesion</h5>
                      <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                  </div>
                  <div class="modal-body">¿Estas seguro de que deseas cerrar sesion?</div>
                  <div class="modal-footer">
                      <a href="login.html" class="btn btn-danger" onclick="logout()">Aceptar</a>
                      <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                  </div>
              </div>
          </div>
      </div>

              
          </nav>

        <!-- Modal Bootstrap -->
        <div class="modal fade" id="chapterModal" tabindex="-1" aria-labelledby="chapterModalLabel" aria-hidden="true">
          <div class="modal-dialog">
            <div class="modal-content" style="background-color: #0d0b2d; color: white;">
              <div class="modal-header">
                <h5 class="modal-title" id="chapterModalLabel">Nuevo Capítulo</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
              </div>
              <div class="modal-body" id="modalContent">
                <!-- Aquí se inyectará el nuevo capítulo con JS -->
              </div>
              <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
              </div>
            </div>
          </div>
        </div>


  </header>
  
  <main class="d-flex flex-column align-items-center justify-content-center" style="min-height: 100vh; padding: 2rem;">
    <!-- Formulario de subida -->
    <div class="upload-form text-center mb-5">
      <div class="upload-icon">
        <i class="fas fa-cloud-upload-alt"></i>
      </div>
      <h3 class="text-white mb-4">Crea tu anime</h3>  
      <!-- Sección para capítulos -->
      <div class="mb-4">
        <div id="capitulos">
          <div class="mb-3 p-3 rounded" style="color: white;">
            <input type="text" class="form-control mb-3" id="nombre_anime" placeholder="Título del Anime">
            <input type="text" class="form-control mb-3" id="descripcion_anime" placeholder="Descripción del anime">
            
            <form action="">
              <input type="file" class="form-control mb-3" name="avatar_anime" />
            </form> 
          </div>
        </div>
        <button type="button" class="btn btn-subir" onclick="createAnime(this)">Subir</button>
        <button type="button" class="btn btn-style" onclick="addChapter()">Agregar capítulos</button>
      </div>
    </div>
  
  <!-- Tarjetas de animes -->
    <div class="container my-5">
      <h5 class="text-white mb-3">Tus animes en la plataforma:</h5>
      <div class="d-flex flex-wrap gap-4 justify-content-start align-items-start" style="max-width: 1400px; margin: 0 auto;" id="myUploadedAnimeContainer">

 
      </div> 
    </div>
    </div>

    <!--Aqui termina-->


  </main>
  




  <footer class="text-center py-4 mt-5 text-white">
    <div class="contenedor_footer" style="background-color: #1b1a29;">
        <br><p class="mb-0">© 2025 SakuraVoid - Todos los derechos reservados</p>
        <img src="../assets/img/logo_b.png" alt="SakuraVoid" style=" width: 150px; height: 70px; margin: 0 auto; padding: 10px; display: flex; justify-content: center; align-items: center;">
      </div>
  </footer>


        <!-- Bootstrap JavaScript Libraries -->
        <script
            src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
            integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
            crossorigin="anonymous"
        ></script>

        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.min.js"
            integrity="sha384-BBtl+eGJRgqQAUMxJ7pMwbEyER4l1g+O15P+16Ep7Q9Q+zqX6gSbd85u4mG4QzX+"
            crossorigin="anonymous"
        ></script>

        <script>
            const user = sessionStorage.getItem('user');
            const dropdown = document.getElementById('userDropdown');

            if (!user && dropdown) {
                dropdown.addEventListener('click', () => {
                window.location.href = "login.html";
                });
            }
        </script>
        
        </script>

        <!--Cambio para Sakura original-->
        <script type="module">
        import { DotLottie } from "https://cdn.jsdelivr.net/npm/@lottiefiles/dotlottie-web/+esm";

        // Inicia animación
        new DotLottie({
        autoplay: true,
        loop: true,
        canvas: document.getElementById("dotlottie-canvas"),
        src: '../assets/img/gato.json'
        });

          // Oculta el loader cuando todo el contenido ha cargado

        window.addEventListener("load", () => {
            const loader = document.getElementById("loader-container");
            if (loader) loader.style.display = "none";
        });

        </script>


</body>
</html>
