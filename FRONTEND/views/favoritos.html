<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mis Favoritos - SakuraVoid</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://kit.fontawesome.com/5d505c9b72.js" crossorigin="anonymous"></script>
 <style>
            body {
                background: black;
                font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            }

            .form-control {
                background-color: transparent;
                border: none;
                border-bottom: 1px solid white;
                color: white;
                border-radius: 0;
            }

            .form-control:focus {
                box-shadow: none;
                border-color: #7979f8;
            }

            input::placeholder,
            textarea::placeholder {
                color: gray !important;
                opacity: 1 !important;
            }


            .anime-card {
                cursor: pointer;
                transition: transform 0.2s;
                font-size: 0.9rem;
                
            }

            .anime-card:hover {
                transform: scale(1.01);
            }

            .btn-ver {
                  background: linear-gradient(to right, #007bff, #ff69b4);
                    color: white;
                    font-size: 12px;
                    margin-bottom: 10px; 
                    color: white; 
                    border: none; 
                    border-radius: 4px;
            }

            .btn-ver:hover {
                background-color: #893bf0;
            }

    
        </style>
     <script src="../controllers/env.js"></script>
    <script src="../controllers/auth_controller.js"></script>
    <script src="../controllers/anime_controller.js"></script>
</head>
<body>

    <div id="loader-container" style="position: fixed; top:0; left:0; width:100vw; height:100vh; background:black; z-index:9999; display:flex; justify-content:center; align-items:center;">
    <canvas id="dotlottie-canvas" style="width: 300px; height:300px;"></canvas>
    </div>
    <header>

        <nav class="navbar navbar-expand-lg navbar-light fixed-top" style="background-color: #070522;">
            <div class="container-fluid">

                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav" style="margin-top: 10px;">

                    <ul class="navbar-nav me-auto" style="width: 100%; display: flex; justify-content: flex-start; gap: 40px;">
                        <li class="nav-item" style="display: flex; flex-direction: column; align-items: center;">
                            <a href="home.html" title="Ir al inicio">
                                <img src="../assets/img/logo_transparente.png" alt="SakuraVoid" style=" width: 150px; height: 70px;">
                            </a>
                        </li>
                    
                        <li class="nav-item" style="display: flex; flex-direction: column; align-items: center;">
                            <a href="favoritos.html" title="favoritos">
                                <i class="fa-solid fa-heart-circle-plus" title="Favoritos" style="cursor: pointer; font-size: 20px; color: #3084B8;"></i>
                            </a>
                            <a class="nav-link" style="color: #3084B8; padding: 0;" href="favoritos.html">Favoritos</a>
                        </li>
                    
                        <li class="nav-item" style="display: flex; flex-direction: column; align-items: center;">
                            <a href="upload.html" title="Upload">
                                <i class="fa-solid fa-cloud-arrow-up" title="Upload" style="cursor: pointer; font-size: 20px; color: white;"></i>
                            </a>
                            <a class="nav-link" style="color: white; padding: 0;" href="upload.html">Upload</a>
                        </li>
                    </ul>

                    <form class="d-flex me-3">
                        <input id="buscar" class="form-control me-2" type="search" placeholder="Buscar" aria-label="Search">
                        <button class="btn" type="submit">
                            <i class="fa-solid fa-magnifying-glass" id="iconobuscar" style="color: white;"></i>
                        </button>

                    </form>
                        <ul class="navbar-nav">
                            <li class="nav-item dropdown">
                                <a class="nav-link dropdown-toggle" href="#" id="userDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                                <i class="fas" style="font-size: 22px; color: white;">&#xf007;</i>
                                </a>
                                <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="userDropdown">
                                <li><a class="dropdown-item" href="perfil.html">Ver mi perfil</a></li>
                                <li><a class="dropdown-item text-danger" href="#" onclick="logout()">Cerrar sesión</a></li>
                                </ul>
                            </li>
                        </ul>
                </div>
            </div>
            <div class="modal fade" id="logoutModal" tabindex="-1">
                <div class="modal-dialog">
                    <div class="modal-content">
                        <div class="modal-header">
                            <h5 class="modal-title">Cerrar sesion</h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                        </div>
                        <div class="modal-body">¿Estas seguro de que deseas cerrar sesion?</div>
                        <div class="modal-footer">
                            <a href="login.html" class="btn btn-danger" onclick="logout()">Aceptar</a>
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                        </div>
                    </div>
                </div>
            </div>
        </nav>
    </header>


    <main class="container main" style="margin-top: 150px;">

        <div class="container mt-4">
            <h2 class="text-center mb-4">Mis Animes Favoritos</h2>
            <div style="display: flex; justify-content: center; padding-top: 30px;">

                <!-- Contenedor de las cards -->
                <div style="display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; max-width: 1480px; " id="favoriteAnimeContainer" ></div>
            </div>
        </div>


        <!-- JavaScript para alternar el estado del ícono -->
        <script>
            document.querySelectorAll('.favorite-icon').forEach(icon => {
                icon.addEventListener('click', () => {
                    icon.classList.toggle('fa-regular');
                    icon.classList.toggle('fa-solid');
                });
            });
        </script>



    </main>




    <footer class="text-center py-4 mt-5 text-white">
        <div class="contenedor_footer" style="background-color: #1b1a29;">
            <br><p class="mb-0">© 2025 SakuraVoid - Todos los derechos reservados</p>
            <img src="../assets/img/logo_b.png" alt="SakuraVoid" style=" width: 150px; height: 70px; margin: 0 auto; padding: 10px; display: flex; justify-content: center; align-items: center;">
          </div>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        const user = sessionStorage.getItem('user');
        const dropdown = document.getElementById('userDropdown');

        if (!user && dropdown) {
            dropdown.addEventListener('click', () => {
            window.location.href = "login.html";
            });
        }
    </script>
    </script>

    <!--Cambio para Sakura original-->
    <script type="module">
    import { DotLottie } from "https://cdn.jsdelivr.net/npm/@lottiefiles/dotlottie-web/+esm";

    // Inicia animación
    new DotLottie({
    autoplay: true,
    loop: true,
    canvas: document.getElementById("dotlottie-canvas"),
    src: '../assets/img/gato.json'
    });

        // Oculta el loader cuando todo el contenido ha cargado

    window.addEventListener("load", () => {
        const loader = document.getElementById("loader-container");
        if (loader) loader.style.display = "none";
    });

    </script>

</body>
</html>
