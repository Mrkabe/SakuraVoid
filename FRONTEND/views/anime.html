        <!-- Bootstrap CSS v5.2.1 -->

        <script src="https://kit.fontawesome.com/5d505c9b72.js" crossorigin="anonymous"></script>
        <style>
            body {
                background: black;
                font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            }

            .container {
                display: flex;
                width: 100%;
                justify-content: center;
            }

            .video-section {
                width: 60%;
                background-color: #000;
                display: flex;
                justify-content: center;
                align-items: center;
            }

            .video-section video {
                max-width: 100%;
                max-height: 100%;
            }

            .chapter-list {
                width: 20%;
                background-color: #1e1e1e;
                color: white;
                overflow-y: auto;
                padding: 1rem;
            }

            .card{
                width: 20%;
            }

            .chapter {
                padding: 10px;
                border-bottom: 1px solid #251479;
                cursor: pointer;
            }

            .chapter:hover {
                background-color: #251479;
            }

            .form-control {
                background-color: transparent;
                border: none;
                border-bottom: 1px solid white;
                color: white;
                border-radius: 0;
            }

            .form-control:focus {
                box-shadow: none;
                border-color: #7979f8;
            }

            input::placeholder,
            textarea::placeholder {
                color: gray !important;
                opacity: 1 !important;
            }
            #resultadosBusqueda div:hover {
                background-color: #343a40;
                cursor: pointer;}
    
        </style>
        <script src="../controllers/env.js"></script>
        <script src="../controllers/auth_controller.js"></script>
        <script src="../controllers/anime_view_controller.js"></script>

        <script src="../controllers/search_controller.js"></script>

    </head>

    <body>

    </div>

        <header>

                        </ul>

                                <!-- Contenedor de resultados, posicionado relativamente al padre -->

        <!-- Modal de Cierre-->

        <main class="container main" style="margin-top: 150px;">

            <div class="container" style="margin: 30px;">
            <!-- Reproductor de video -->
                <div class="video-section">
                    <video id="videoPlayer" controls class="w-100 my-3" style="max-height: 400px;"></video>

                </div>
                
            <!-- Lista de capítulos -->
                <div class="chapter-list">
                <ul id="episodeList" class="list-group list-group-flush"></ul>
                </div>



            <!-- Card individual -->
           <!-- Contenedor de información del anime -->
            <div class="card" id="animeViewContainer" style="width: 200px; height: 400px; display: flex; flex-direction: column; color: white; background-color: #251479; margin-left: 50px; position: relative;">

        <footer class="text-center py-4 mt-5 text-white">

        </footer>
        <!-- Bootstrap JavaScript Libraries -->
        <script
            src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
            integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
            crossorigin="anonymous"
        ></script>

        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.min.js"
            integrity="sha384-BBtl+eGJRgqQAUMxJ7pMwbEyER4l1g+O15P+16Ep7Q9Q+zqX6gSbd85u4mG4QzX+"
            crossorigin="anonymous"
        ></script>
        </script>

        <!--Cambio para Sakura original-->
        <script type="module">
        import { DotLottie } from "https://cdn.jsdelivr.net/npm/@lottiefiles/dotlottie-web/+esm";

        // Inicia animación
        new DotLottie({
        autoplay: true,
        loop: true,
        canvas: document.getElementById("dotlottie-canvas"),
        src: '../assets/img/gato.json'
        });

          // Oculta el loader cuando todo el contenido ha cargado

        window.addEventListener("load", () => {
            const loader = document.getElementById("loader-container");
            if (loader) loader.style.display = "none";
        });

        </script>

    </body>
